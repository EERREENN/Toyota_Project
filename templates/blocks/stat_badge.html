{# BUYUK RAKAM ROZETI -- .tk-stat-badge (eski .milestone-badge) #}
{% import "blocks/_macros.html" as m with context %}
{%- set oge = blok.first_of('stat') %}
{%- if oge %}
<div class="{{ m.kabuk_sinif(blok, 'tk-stat-badge') }}"{{ m.capa(blok) }}>
  <span class="tk-stat-badge__value"{{ m.sayac(oge) }}>{{ oge.value }}</span>
  <span class="tk-stat-badge__label">{{ oge.title }}</span>
  {%- if oge.text %}
  <span class="tk-subnote">{{ oge.text }}</span>
  {%- endif %}
</div>
{%- endif %}

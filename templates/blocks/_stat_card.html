{# Tek rakam karti. stat_grid'in iki dalindan da cagriliyor. #}
{%- import "blocks/_macros.html" as m with context -%}
<div class="tk-card">
      <span class="tk-stat-grid__value"{{ m.sayac(oge) }}>{{ oge.value }}</span>
      <h3>{{ oge.title }}</h3>
      {%- if oge.text %}
      <p>{{ oge.text|safe }}</p>
      {%- endif %}
      {%- if oge.note %}
      <p class="tk-note">{{ oge.note }}</p>
      {%- endif %}
    </div>

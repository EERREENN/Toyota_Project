{% extends "admin/base.html" %}
{% block title %}Giriş{% endblock %}

{% block content %}
<div class="yn-giris">
  <h1>Toyota <span>yönetim</span></h1>
  <p class="yn-giris__not">Devam etmek için şifreyi gir.</p>

  <form method="post" class="yn-form">
    <input type="hidden" name="_csrf" value="{{ csrf }}">
    <div class="yn-alan">
      <label for="parola">Şifre</label>
      <input type="password" id="parola" name="parola"
             autocomplete="current-password" autofocus required>
    </div>
    <button type="submit" class="yn-dugme yn-dugme--birincil">Giriş yap</button>
  </form>
</div>
{% endblock %}

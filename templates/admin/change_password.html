{% extends "admin/base.html" %}
{% block title %}Şifre değiştir{% endblock %}

{% block content %}
<h1 class="yn-baslik">Şifre değiştir</h1>
<p class="yn-aciklama">
  Yeni şifre veritabanına şifrelenmiş olarak kaydedilir.
  <code>.env</code> dosyasını elle değiştirmene gerek yok.
</p>

<form method="post" class="yn-form yn-form--dar">
  <input type="hidden" name="_csrf" value="{{ csrf }}">
  <div class="yn-alan">
    <label for="mevcut">Mevcut şifre</label>
    <input type="password" id="mevcut" name="mevcut"
           autocomplete="current-password" required>
  </div>
  <div class="yn-alan">
    <label for="yeni">Yeni şifre</label>
    <input type="password" id="yeni" name="yeni"
           autocomplete="new-password" minlength="8" required>
    <small>En az 8 karakter.</small>
  </div>
  <div class="yn-alan">
    <label for="tekrar">Yeni şifre (tekrar)</label>
    <input type="password" id="tekrar" name="tekrar"
           autocomplete="new-password" minlength="8" required>
  </div>
  <button type="submit" class="yn-dugme yn-dugme--birincil">Değiştir</button>
</form>
{% endblock %}
